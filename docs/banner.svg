<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Omarchy Window Snap</title>
  <desc id="desc">Three windows on a screen. A gold guide line marks half the width, and the edge of a window is snapping down to a second guide line at three quarters of the height.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1915"/>
      <stop offset="1" stop-color="#0f0e0c"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8ad62" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d8ad62" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d8ad62" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d8ad62"/>
    </marker>
  </defs>

  <rect width="1280" height="400" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="20" fill="url(#dots)"/>

  <!-- Title -->
  <g font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="72" y="150" font-size="22" fill="#d8ad62" letter-spacing="4">FOR OMARCHY</text>
    <text x="70" y="214" font-size="60" font-weight="700" fill="#efe8dc">Window Snap</text>
    <text x="72" y="262" font-size="21" fill="#a79f92">Drag an edge. It snaps to 1/4, 1/2, 3/4</text>
    <text x="72" y="292" font-size="21" fill="#a79f92">or your own fractions, per workspace.</text>
  </g>

  <!-- Screen -->
  <g transform="translate(690 58)">
    <rect x="0" y="0" width="520" height="284" rx="10" fill="#0b0a09" stroke="#3a352d" stroke-width="2"/>
    <!-- bar -->
    <rect x="1" y="1" width="518" height="16" rx="9" fill="#171511"/>
    <circle cx="14" cy="9" r="3" fill="#d8ad62"/>
    <circle cx="26" cy="9" r="3" fill="#5a5247"/>
    <circle cx="38" cy="9" r="3" fill="#5a5247"/>

    <!-- left window: half the width -->
    <rect x="10" y="26" width="245" height="248" rx="4" fill="#191713" stroke="#5a5247" stroke-width="2"/>
    <text x="22" y="48" font-family="ui-monospace, monospace" font-size="12" fill="#8a8274">~ &gt;</text>
    <rect x="22" y="60" width="120" height="6" rx="3" fill="#2c2822"/>
    <rect x="22" y="74" width="176" height="6" rx="3" fill="#2c2822"/>
    <rect x="22" y="88" width="92" height="6" rx="3" fill="#2c2822"/>

    <!-- top right window: being dragged, its bottom edge just short of 3/4 -->
    <rect x="265" y="26" width="245" height="162" rx="4" fill="#1d1a15" stroke="#d8ad62" stroke-width="2"/>
    <text x="277" y="48" font-family="ui-monospace, monospace" font-size="12" fill="#8a8274">~ &gt;</text>
    <rect x="277" y="60" width="150" height="6" rx="3" fill="#2c2822"/>
    <rect x="277" y="74" width="96" height="6" rx="3" fill="#2c2822"/>

    <!-- bottom right window -->
    <rect x="265" y="196" width="245" height="78" rx="4" fill="#191713" stroke="#5a5247" stroke-width="2"/>
    <text x="277" y="218" font-family="ui-monospace, monospace" font-size="12" fill="#8a8274">~ &gt;</text>

    <!-- guide: half the width -->
    <rect x="200" y="22" width="120" height="256" fill="url(#glow)"/>
    <line x1="260" y1="22" x2="260" y2="278" stroke="#d8ad62" stroke-width="3"/>
    <rect x="240" y="112" width="40" height="22" rx="5" fill="#d8ad62"/>
    <text x="260" y="128" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#14120f">1/2</text>

    <!-- guide: three quarters of the height, where the dragged edge lands -->
    <line x1="10" y1="207" x2="510" y2="207" stroke="#d8ad62" stroke-width="3" stroke-dasharray="10 6"/>
    <rect x="16" y="196" width="40" height="22" rx="5" fill="#d8ad62"/>
    <text x="36" y="212" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#14120f">3/4</text>
    <line x1="400" y1="190" x2="400" y2="201" stroke="#d8ad62" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- cursor on the dragged edge -->
    <path d="M440 182 l0 22 l6 -6 l5 11 l4 -2 l-5 -11 l8 0 z" fill="#efe8dc" stroke="#0b0a09" stroke-width="1.5"/>
  </g>
</svg>
